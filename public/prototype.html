<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f33">
<title>שׁוֹמְרֵי הַזְּמַן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0f0b2a; --night2:#2b1f5e;
  --parch1:#fdf7e6; --parch2:#f4e4be; --goldline:#d4a94f; --gold:#f0c35a; --gold2:#c98d1e;
  --ink:#3a2614; --muted:#8a7357; --ok:#1e9e5a; --bad:#d9534f; --accent:#5b3fd1;
  --display:'Frank Ruhl Libre','Noto Sans Hebrew',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Noto Sans Hebrew',Arial,sans-serif;color:var(--ink);background-color:var(--night1);
  background-image:radial-gradient(ellipse at 50% -10%,#3f2c8c 0%,transparent 60%),radial-gradient(ellipse at 100% 110%,#173a66 0%,transparent 55%),linear-gradient(var(--night2),var(--night1));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;user-select:none;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
   radial-gradient(1.6px 1.6px at 8% 18%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 64%,#fff 50%,transparent 51%),
   radial-gradient(1.8px 1.8px at 35% 12%,#ffe9a8 50%,transparent 51%),radial-gradient(1.2px 1.2px at 47% 82%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 61% 33%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 74% 9%,#fff 50%,transparent 51%),
   radial-gradient(1.8px 1.8px at 88% 52%,#ffe9a8 50%,transparent 51%),radial-gradient(1.2px 1.2px at 93% 85%,#fff 50%,transparent 51%),
   radial-gradient(1.4px 1.4px at 15% 92%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 54% 54%,#fff 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 80% 70%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 3% 45%,#fff 50%,transparent 51%);}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:linear-gradient(rgba(15,11,42,.92),rgba(15,11,42,.75));backdrop-filter:blur(6px);color:#fff;border-bottom:1px solid rgba(240,195,90,.25)}
.pill{background:rgba(240,195,90,.12);border:1px solid rgba(240,195,90,.35);border-radius:999px;padding:5px 14px;font-weight:800;font-size:20px;display:flex;gap:6px;align-items:center;color:#ffe7a6}
#topbar .spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:14px;font-size:22px;width:46px;height:46px}
#rank{font-size:16px;font-weight:600;color:#d9cfff}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 16px 60px}

/* ---------- parchment panel ---------- */
.panel{position:relative;background:linear-gradient(170deg,var(--parch1),var(--parch2));border:3px solid var(--goldline);border-radius:24px;padding:28px;
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 50px rgba(160,110,40,.16);outline:2px solid rgba(212,169,79,.45);outline-offset:-11px}
h1,h2{margin:0 0 12px}
.display{font-family:var(--display);font-weight:900}

/* ---------- title ---------- */
.logo{display:flex;flex-direction:column;align-items:center;margin:18px 0 8px}
.logo svg{width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(240,195,90,.55));animation:float 4s ease-in-out infinite}
.big-title{font-family:var(--display);font-weight:900;text-align:center;font-size:50px;margin:4px 0;line-height:1.3;
  background:linear-gradient(#fff3c4,#f0c35a 55%,#c98d1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.subtitle{color:#d9cfff;text-align:center;font-size:20px;margin-bottom:24px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- worlds ---------- */
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.world{border-radius:24px;padding:0;overflow:hidden;color:#fff;text-align:right;display:flex;flex-direction:column;position:relative;
  border:3px solid var(--goldline);box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .15s;background:#24194a}
.world:active{transform:scale(.97)}
.world .art{height:170px;display:block}
.world .art svg{width:100%;height:100%;display:block}
.world .wtxt{padding:14px 18px 18px;display:flex;flex-direction:column;gap:2px}
.world b{font-family:var(--display);font-size:28px;color:#ffe7a6}
.world span{font-size:17px;color:#d9cfff}
.locked{filter:grayscale(.6) brightness(.8)}
.lock-tag{position:absolute;top:12px;left:12px;background:rgba(10,6,30,.75);border-radius:999px;padding:5px 12px;font-size:15px;color:#fff}

/* ---------- map ---------- */
.mapwrap{position:relative;margin:0 auto}
.mapwrap > svg.trail{position:absolute;inset:0;pointer-events:none}
.mnode{position:absolute;width:124px;display:flex;flex-direction:column;align-items:center;text-align:center}
.medal{width:118px;height:118px;border-radius:50%;overflow:hidden;position:relative;padding:0;background:#1c1440;
  border:5px solid var(--gold);box-shadow:0 0 0 3px #7a5414,0 10px 26px rgba(0,0,0,.55);transition:transform .15s}
.medal svg{width:100%;height:100%;display:block}
.medal:active{transform:scale(.95)}
.medal.done{border-color:#ffe08a}
.medal.current{animation:glow 1.6s ease-in-out infinite}
.medal.lockedm{border-color:#6c5b99;box-shadow:0 0 0 3px #352a5c,0 10px 26px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:38px;cursor:default}
.medal .lockveil{position:absolute;inset:0;background:rgba(20,14,50,.72);display:flex;align-items:center;justify-content:center;font-size:36px}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #7a5414,0 0 12px 4px rgba(240,195,90,.45)}50%{box-shadow:0 0 0 3px #7a5414,0 0 34px 14px rgba(240,195,90,.85)}}
.mlabel{margin-top:8px;color:#fff;font-weight:800;font-size:18px;line-height:1.3;text-shadow:0 2px 4px rgba(0,0,0,.8);width:170px}
.mstars{font-size:17px;letter-spacing:2px;margin-top:2px}
.ribbon{position:absolute;top:-46px;white-space:nowrap;background:linear-gradient(#f6d27a,#d89f2c);color:#3a2614;font-family:var(--display);font-weight:900;
  font-size:19px;padding:4px 18px;border-radius:8px;box-shadow:0 4px 0 #8a5d12,0 6px 14px rgba(0,0,0,.4)}
.youhere{position:absolute;top:-30px;right:-18px;background:#fff;color:var(--accent);font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:float 2s ease-in-out infinite}

/* ---------- level ---------- */
.progress{display:flex;gap:6px;margin:4px 0 14px}
.progress span{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.08)}
.progress span.on{background:linear-gradient(var(--gold),var(--gold2));border-color:#ffe08a}
.scene{margin:-28px -28px 0;height:260px;border-radius:21px 21px 0 0;overflow:hidden;position:relative;border-bottom:3px solid var(--goldline)}
.scene svg{width:100%;height:100%;display:block}
.sticker{position:absolute;bottom:14px;left:18px;width:84px;height:84px;border-radius:50%;background:var(--parch1);border:4px solid var(--goldline);
  display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:pop .6s .4s both}
.guide{display:flex;gap:12px;align-items:flex-end;margin:-46px 0 14px;position:relative}
.guide.flat{margin-top:0}
.avatar{flex:none;width:86px;height:86px;border-radius:50%;border:4px solid var(--goldline);background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.3);overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
.guide-name{background:var(--accent);color:#fff;font-weight:800;font-size:16px;border-radius:999px;padding:3px 14px;margin-bottom:6px}
.story{font-size:32px;line-height:1.85;font-weight:600;color:var(--ink)}
.story p{margin:0 0 6px;opacity:0;transform:translateY(8px);animation:in .45s forwards}
@keyframes in{to{opacity:1;transform:none}}
.question{font-size:28px;line-height:1.75;font-weight:800;margin-bottom:18px;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.btn{border-radius:18px;padding:15px 28px;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(#7b61ff,#4b31c9);box-shadow:0 6px 0 #2e1d8a,0 8px 18px rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e1d8a}
.btn.go{background:linear-gradient(#3ddc84,#16a36a);box-shadow:0 6px 0 #0d6e47,0 8px 18px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(#f6d27a,#d89f2c);color:#3a2614;box-shadow:0 6px 0 #8a5d12,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(91,63,209,.1);color:var(--accent);box-shadow:0 4px 0 rgba(91,63,209,.25);font-size:20px;padding:11px 18px;border:2px solid rgba(91,63,209,.25)}
.btn:disabled{opacity:.45}
.options{display:grid;gap:14px}
.opt{text-align:right;background:#fffdf6;border:3px solid #e4cf9a;border-radius:18px;padding:16px 22px;font-size:28px;font-weight:600;color:var(--ink);box-shadow:0 5px 0 #d9bf82}
.opt:active{transform:translateY(3px)}
.opt.right{border-color:var(--ok);background:#e6f9ee;box-shadow:0 5px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeeee;box-shadow:0 5px 0 var(--bad);opacity:.6}
.options.tf{grid-template-columns:1fr 1fr}
.options.tf .opt{text-align:center;font-size:30px;font-weight:800}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
.words{font-size:34px;line-height:2.2;font-weight:600}
.w{display:inline-block;padding:0 8px;border-radius:12px;margin:2px;cursor:pointer;border-bottom:3px dashed #d4b46a}
.w.right{background:#c8f2d8;border-color:var(--ok)}
.w.wrong{background:#f9d5d3}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:70px}
.chip{background:#fffdf6;border:3px solid #e4cf9a;border-radius:14px;padding:9px 18px;font-size:28px;font-weight:600;box-shadow:0 4px 0 #d9bf82;color:var(--ink)}
.slot{border:3px dashed #d4b46a;border-radius:18px;padding:10px;background:rgba(255,255,255,.5);margin-bottom:14px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:520px}
.numpad button{font-size:30px;font-weight:800;border-radius:14px;padding:13px 0;background:#fffdf6;border:3px solid #e4cf9a;box-shadow:0 4px 0 #d9bf82;color:var(--ink)}
.numdisplay{font-size:48px;font-weight:800;min-width:140px;text-align:center;background:rgba(255,255,255,.6);border:3px dashed #d4b46a;border-radius:18px;padding:6px 20px;display:inline-block;margin-bottom:14px;min-height:80px}
textarea,input[type=text],input[type=number],input[type=password]{width:100%;font-family:inherit;font-size:28px;border:3px solid #e4cf9a;border-radius:16px;padding:14px;color:var(--ink);background:#fffdf6;user-select:text}
textarea{min-height:150px;resize:vertical;line-height:1.6;background-image:repeating-linear-gradient(transparent 0 44px,#ecdcb4 44px 46px);background-attachment:local}
.meter{height:16px;border-radius:8px;background:rgba(0,0,0,.08);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));width:0;transition:width .3s}
.meter-label{font-size:18px;color:var(--muted)}
.hint{margin-top:16px;background:#fff3cf;border-radius:14px;padding:12px 16px;font-size:24px;border-right:6px solid var(--gold2)}
.feedback{font-size:26px;font-weight:800;margin-top:12px;min-height:36px}
.small{font-size:18px;color:var(--muted)}

/* ---------- overlay & celebrations ---------- */
#overlay{position:fixed;inset:0;background:rgba(8,5,26,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay .panel{max-width:620px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.restored{width:230px;height:115px;margin:0 auto 6px;border-radius:16px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 3px #7a5414,0 0 40px rgba(240,195,90,.8);animation:pop .7s}
.restored svg{width:100%;height:100%;display:block}
.stars-big{font-size:46px;letter-spacing:8px}
.wincard{display:flex;gap:14px;align-items:center;text-align:right;max-width:420px;margin:10px auto 0;padding:12px 14px;min-height:0}
.wincard .e{flex:none;width:70px;height:70px;font-size:38px;margin:0}
.wincard b{margin:0 0 4px}
.stars-big span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.coinfly{position:fixed;font-size:32px;pointer-events:none;z-index:60;animation:fly 1s forwards;font-weight:800;color:var(--gold);text-shadow:0 2px 0 #7a5414}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) scale(1.4)}}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:55;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.chest{width:120px;cursor:pointer;display:inline-block;animation:wobble 1s infinite;background:none;padding:0}
.chest svg{width:100%;display:block}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.ccard{background:linear-gradient(165deg,#fffaf0,#f6e3b4);border:3px solid var(--goldline);border-radius:18px;padding:16px;text-align:center;
  box-shadow:0 6px 0 #8a5d12,0 10px 24px rgba(0,0,0,.35);min-height:230px;outline:2px solid rgba(212,169,79,.5);outline-offset:-8px}
.ccard .e{width:88px;height:88px;margin:4px auto 6px;border-radius:50%;background:radial-gradient(#fff,#f3d98f);border:3px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-size:48px}
.ccard b{display:block;font-family:var(--display);font-size:22px;margin:6px 0;color:var(--ink)}
.ccard small{font-size:16px;color:var(--muted);line-height:1.5;display:block}
.ccard.off{background:linear-gradient(165deg,#3a2f66,#261d4d);border-color:#6c5b99;box-shadow:0 6px 0 #1a1238;outline-color:rgba(108,91,153,.5)}
.ccard.off .e{background:#1c1440;border-color:#6c5b99;filter:grayscale(1) brightness(.35)}
.ccard.off b,.ccard.off small{color:#a99fd0}

/* ---------- parent ---------- */
.ptable{width:100%;border-collapse:collapse;font-size:20px;margin:10px 0 20px}
.ptable td{padding:8px;border-bottom:1px solid #e4cf9a}
label.field{display:block;font-size:20px;margin:12px 0}
label.field input{font-size:22px;padding:8px 12px;margin-top:4px}

@media (max-width:600px){
  .story{font-size:26px}.question{font-size:24px}.opt{font-size:23px}.btn{font-size:22px}.words{font-size:28px}
  .panel{padding:20px}.scene{margin:-20px -20px 0;height:170px}.big-title{font-size:38px}
  .avatar{width:70px;height:70px}.sticker{width:64px;height:64px;font-size:36px}
  #rank{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <button class="iconbtn" id="homeBtn" title="בַּיִת">🏠</button>
  <div class="pill" title="מַטְבְּעוֹת">🪙 <span id="coins">0</span></div>
  <div class="pill" title="יָמִים בָּרֶצֶף">🔥 <span id="streak">0</span></div>
  <div id="rank"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="cardsBtn" title="הָאֹסֶף שֶׁלִּי">🃏</button>
  <button class="iconbtn" id="parentBtn" title="אֵזוֹר הוֹרִים">⚙️</button>
</div>

<main id="app"></main>
<div id="overlay" class="hidden"><div class="panel" id="overlayBody"></div></div>

<script>
/* =====================================================================
   תוכן המשחק
   כאן נמצאים כל הסיפורים והמשימות. כדי להוסיף שלב – מעתיקים שלב קיים
   ומשנים את הטקסטים. {name} מוחלף בשם של הילד.
   scene = האיור של השלב (library, syracuse, bath, venice, desert, palace, prison)
   בכל צעד אפשר לשנות: scene:'...', night:true (לילה), eraser:true (המוחק מופיע), pic:'💴' (מדבקה)
   ===================================================================== */
const GUIDE = { name: 'יוּבַל' };

const CARDS = {
  book:       { e:'📖', name:'סֵפֶר הַזְּמַן', fact:'כָּל הַסִּפּוּרִים שֶׁל הָעוֹלָם גָּרִים בְּתוֹכוֹ. הַמּוֹחֵק רוֹצֶה לִמְחֹק אוֹתָם.' },
  crown:      { e:'👑', name:'כֶּתֶר הַזָּהָב', fact:'מֶלֶךְ סִירָקוּזָה חָשַׁד שֶׁהַצּוֹרֵף רִמָּה אוֹתוֹ.' },
  archimedes: { e:'🛁', name:'אַרְכִימֶדֶס', fact:'מַדְעָן וּמַמְצִיא מִסִּירָקוּזָה. גִּלָּה אֵיךְ מַיִם עוֹזְרִים לִמְדֹּד חֲפָצִים, וְהִמְצִיא מְכוֹנוֹת עֲנָק לְהָגֵן עַל הָעִיר.' },
  venice:     { e:'🛶', name:'וֶנֶצְיָה', fact:'עִיר שֶׁבְּנוּיָה עַל הַמַּיִם. בִּמְקוֹם רְחוֹבוֹת יֵשׁ תְּעָלוֹת, וּבִמְקוֹם מְכוֹנִיּוֹת – סִירוֹת.' },
  desert:     { e:'🏜️', name:'הַמִּדְבָּר הַגָּדוֹל', fact:'מַרְקוֹ סִפֵּר שֶׁבַּמִּדְבָּר יֵשׁ קוֹלוֹת שֶׁקּוֹרְאִים לַנּוֹסְעִים בַּשֵּׁם. לָכֵן תָּלוּ פַּעֲמוֹנִים עַל הַגְּמַלִּים.' },

let GID = 0;
function rng(seed){ let s = 7; for(const c of seed) s = (s*31 + c.charCodeAt(0)) >>> 0; return ()=>{ s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }
const star4 = (x,y,r,fill='#fff6c8',op=1)=>`<path d="M${x} ${y-r}L${x+r*.22} ${y-r*.22}L${x+r} ${y}L${x+r*.22} ${y+r*.22}L${x} ${y+r}L${x-r*.22} ${y+r*.22}L${x-r} ${y}L${x-r*.22} ${y-r*.22}Z" fill="${fill}" opacity="${op}"/>`;

function sky(id, night, top, bottom, seed, sun){
  const t = night ? '#0b0a2a' : top, b = night ? '#3a2c70' : bottom;
  let s = `<defs><linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient>
    <radialGradient id="${id}glow"><stop offset="0" stop-color="#fff7c2" stop-opacity=".95"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></radialGradient></defs>
    <rect width="800" height="320" fill="url(#${id}sky)"/>`;
  if(night){
    const r = rng(seed);
    for(let i=0;i<46;i++) s += `<circle cx="${(r()*800).toFixed(0)}" cy="${(r()*190).toFixed(0)}" r="${(r()*1.6+.5).toFixed(1)}" fill="#fff" opacity="${(r()*.6+.4).toFixed(2)}"/>`;
    s += `<circle cx="660" cy="80" r="80" fill="url(#${id}glow)" opacity=".5"/><circle cx="660" cy="80" r="28" fill="#fdf3c4"/><circle cx="650" cy="74" r="5" fill="#efe2a8"/><circle cx="668" cy="90" r="4" fill="#efe2a8"/>`;
  } else if(sun){
    s += `<circle cx="${sun[0]}" cy="${sun[1]}" r="120" fill="url(#${id}glow)" opacity=".8"/><circle cx="${sun[0]}" cy="${sun[1]}" r="38" fill="#fff4b8"/>`;
  }
  return s;
}
function eraserFig(x,y,s=1,op=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}">
    <ellipse cx="0" cy="48" rx="46" ry="7" fill="#000" opacity=".35"/>
    <path d="M0 -72C-24 -72 -36 -50 -36 -28L-50 46Q0 58 50 46L36 -28C36 -50 24 -72 0 -72Z" fill="#0d0716"/>
    <path d="M-36 -10Q-60 10 -52 40L-40 40Q-44 14 -30 0Z" fill="#160c24"/><path d="M36 -10Q60 10 52 40L40 40Q44 14 30 0Z" fill="#160c24"/>
    <path d="M0 -62C-15 -62 -22 -48 -22 -34Q0 -20 22 -34C22 -48 15 -62 0 -62Z" fill="#000"/>
    <ellipse cx="-8" cy="-40" rx="7" ry="4" fill="#ff4d6d" opacity=".35"/><ellipse cx="8" cy="-40" rx="7" ry="4" fill="#ff4d6d" opacity=".35"/>
    <ellipse cx="-8" cy="-40" rx="3.4" ry="1.8" fill="#ff8095"/><ellipse cx="8" cy="-40" rx="3.4" ry="1.8" fill="#ff8095"/>
  </g>`;
}
function camel(x,y,s,c){
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}">
    <ellipse cx="0" cy="0" rx="24" ry="11"/><ellipse cx="3" cy="-9" rx="11" ry="10"/>
    <path d="M-18 -4Q-27 -10 -28 -25L-22 -27Q-20 -13 -11 -6Z"/><ellipse cx="-30" cy="-27" rx="8" ry="4.5"/>
    <rect x="-17" y="5" width="3.5" height="24" rx="1.5"/><rect x="-10" y="5" width="3.5" height="24" rx="1.5"/>
    <rect x="9" y="5" width="3.5" height="24" rx="1.5"/><rect x="15" y="5" width="3.5" height="24" rx="1.5"/>
    <path d="M23 -2Q30 4 27 12" stroke="${c}" stroke-width="2" fill="none"/>
    <rect x="-4" y="-24" width="14" height="8" rx="3" fill="#b03a2e" opacity=".85"/></g>`;
}
function roof(cx,y,w,h,fill){
  return `<path d="M${cx-w/2-14} ${y-14}Q${cx-w/2+w*.08} ${y+2} ${cx-w/2+w*.2} ${y}L${cx+w/2-w*.2} ${y}Q${cx+w/2-w*.08} ${y+2} ${cx+w/2+14} ${y-14}L${cx+w*.3} ${y-h}L${cx-w*.3} ${y-h}Z" fill="${fill}"/>
    <path d="M${cx-w*.3} ${y-h}L${cx+w*.3} ${y-h}" stroke="#f0c35a" stroke-width="4"/>`;
}
function facade(x,y,w,h,color,night,seed){
  const r = rng(seed); let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/><rect x="${x}" y="${y}" width="${w}" height="8" fill="#000" opacity=".12"/>`;
  const cols = Math.max(2, Math.floor(w/30)), gap = w/cols;
  for(let ry=y+26; ry<y+h-40; ry+=46) for(let c=0;c<cols;c++){
    const wx = x + c*gap + gap/2 - 7, lit = night && r()>.35;
    s += `<path d="M${wx} ${ry+26}V${ry+8}A7 7 0 0 1 ${wx+14} ${ry+8}V${ry+26}Z" fill="${lit?'#ffd36b':night?'#1a1433':'#5a3524'}"/>`;
  }
  return s;
}

const $ = s => document.querySelector(s);
const app = $('#app');
const NIKUD = /[֑-ׇֽֿׁׂׅׄ]/g;
const plain = s => s.replace(NIKUD,'');
const tx = s => { s = s.replace(/\{name\}/g, S.name || 'שׁוֹמֵר'); return S.nikud ? s : plain(s); };
const norm = s => plain(s).replace(/[^א-ת0-9]/g,'');
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let screen = 'worlds';

function rank(){ let r = RANKS[0]; RANKS.forEach(x=>{ if(S.done.length >= x.min) r = x; }); return r.name; }
function refreshBar(){
  $('#coins').textContent = S.coins; $('#streak').textContent = S.streak.count;
  $('#rank').textContent = tx(rank()) + (S.name ? ' · ' + S.name : '');
}
// שלב שכבר הושלם בעבר נותן רק חלק קטן מהמטבעות – כדי שלא "יחרוש" שלבים קלים בשביל זמן מסך
const earn = n => (L && L.replay) ? Math.max(1, Math.round(n*0.2)) : n;
function addCoins(n, el){
  if(n<=0) return;
  S.coins += n; save(); refreshBar();
  const r = (el||$('#coins')).getBoundingClientRect();
  const f = document.createElement('div'); f.className='coinfly'; f.textContent = '+' + n + ' 🪙';
  f.style.left = (r.left + r.width/2 - 30) + 'px'; f.style.top = (r.top) + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
}
function confetti(n=40){
  const em = ['⭐','✨','🪙','💛','🌟'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti'; c.textContent=pick(em);
    c.style.left=Math.random()*100+'vw'; c.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3200); }
}
function sound(type){
  try{
    const ctx = sound.ctx || (sound.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const notes = type==='ok' ? [660,880] : type==='win' ? [523,659,784,1046] : [300];
    notes.forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=f; o.type='triangle';
      g.gain.setValueAtTime(.15, ctx.currentTime+i*.12); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+i*.12+.25);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*.12); o.stop(ctx.currentTime+i*.12+.3); });
  }catch(e){}
}
let heVoice = null;
function initVoice(){ try{ heVoice = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('he')) || null; }catch(e){} }
try{ initVoice(); speechSynthesis.onvoiceschanged = initVoice; }catch(e){}
function speak(text){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang='he-IL'; u.rate=.85; if(heVoice) u.voice=heVoice; speechSynthesis.speak(u); }catch(e){}
}
function overlay(html){ $('#overlayBody').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function closeOverlay(){ $('#overlay').classList.add('hidden'); }
function updateStreak(){
  const today = new Date().toDateString();
  if(S.streak.last === today) return;
  const diff = S.streak.last ? Math.round((new Date(today) - new Date(S.streak.last))/86400000) : 99;
  S.streak.count = diff <= 2 ? S.streak.count + 1 : 1;   // סלחני: יום אחד שפוספס לא מאפס
  S.streak.last = today; save();
}

let mapWorld = 'history';
function showMap(world){
  closeOverlay(); screen = 'map'; mapWorld = world;
  const lv = LEVELS[world];
  const firstOpen = lv.findIndex(l=>!l.locked && !S.done.includes(l.id));
  const W = Math.min(app.clientWidth - 32, 640), amp = Math.min(150, W*0.27), stepY = 215, top = 90;
  const pts = lv.map((l,i)=>({ x: W/2 + Math.sin(i*1.2)*amp, y: top + i*stepY }));
  const H = top + (lv.length-1)*stepY + 150;
  let trail = '';
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1], d = `M${a.x} ${a.y}C${a.x} ${a.y+stepY/2} ${b.x} ${b.y-stepY/2} ${b.x} ${b.y}`;
    trail += S.done.includes(lv[i].id)
      ? `<path d="${d}" stroke="#f0c35a" stroke-width="8" fill="none" stroke-linecap="round" opacity=".95"/>`
      : `<path d="${d}" stroke="#ffffff" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round" opacity=".45"/>`;
  }
  app.innerHTML = `<h1 class="big-title" style="font-size:40px">${tx(WORLDS.find(w=>w.id===world).title)}</h1>
    <div class="subtitle">${tx('הַדַּפִּים שֶׁל סֵפֶר הַזְּמַן')}</div>
    <div class="mapwrap" style="width:${W}px;height:${H}px">
      <svg class="trail" width="${W}" height="${H}">${trail}</svg>
      ${lv.map((l,i)=>{
        const done = S.done.includes(l.id), avail = !l.locked && (done || i<=firstOpen || firstOpen===-1), st = S.stars[l.id]||0, cur = i===firstOpen;
        const inner = l.locked ? '🔒' : scene(l.scene, {}) + (avail ? '' : '<div class="lockveil">🔒</div>');
        return `<div class="mnode" style="left:${pts[i].x-62}px;top:${pts[i].y-59}px">
          ${l.chapter?`<div class="ribbon">${tx(l.chapter)}</div>`:''}
          <button class="medal ${done?'done':''} ${cur?'current':''} ${l.locked?'lockedm':''}" data-i="${i}" ${avail?'':'disabled'}>${inner}</button>
          ${cur?`<div class="youhere">${tx('אַתָּה כָּאן')}</div>`:''}
          <div class="mlabel">${tx(l.title)}</div>
          ${done?`<div class="mstars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  app.querySelectorAll('.medal:not([disabled])').forEach(b=>b.onclick=()=>playLevel(world, +b.dataset.i));
  const cur = app.querySelector('.medal.current'); if(cur) setTimeout(()=>cur.scrollIntoView({behavior:'smooth', block:'center'}), 200);
  refreshBar();
}

/* ----------------------------- שלב ----------------------------- */
let L; // current level runtime
function playLevel(world, idx){
  const lvl = LEVELS[world][idx];
  L = { world, idx, lvl, step:0, mistakes:0, lastRead:null, replay:S.done.includes(lvl.id) };
  screen = 'level';
  renderStep();
}
function guideHTML(flat){ return `<div class="guide ${flat?'flat':''}"><div class="avatar">${guideSVG()}</div><div class="guide-name">${tx(GUIDE.name)}</div></div>`; }
function progressHTML(){ return `<div class="progress">${L.lvl.steps.map((_,i)=>`<span class="${i<L.step?'on':''}"></span>`).join('')}</div>`; }
function frame(inner){ app.innerHTML = progressHTML() + `<div class="panel">${inner}</div>`; }
function next(){ L.step++; if(L.step >= L.lvl.steps.length) finishLevel(); else renderStep(); }
function rereadBtn(){ return L.lastRead ? `<button class="btn ghost" id="reread">📖 ${tx('לִקְרֹא שׁוּב')}</button>` : ''; }
function bindReread(){ const b=$('#reread'); if(b) b.onclick=()=>{ overlay(`<div class="story" style="text-align:right">${L.lastRead.map(l=>`<p>${tx(l)}</p>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="ovSpeak">🔊</button><button class="btn go" id="ovClose">${tx('הֵבַנְתִּי')}</button></div>`);
  $('#ovClose').onclick=closeOverlay; $('#ovSpeak').onclick=()=>speak(L.lastRead.map(tx).join(' ')); }; }
function speakBtn(){ return `<button class="btn ghost" id="spk" title="הַקְרֵא לִי">🔊 ${tx('הַקְרֵא לִי')}</button>`; }
function bindSpeak(text){ const b=$('#spk'); if(b) b.onclick=()=>speak(text); }

function correct(el, base=10){
  sound('ok'); S.tasks++; const first = L.tries===0; if(first) S.firstTry++;
  addCoins(earn(first ? base : Math.ceil(base/2)), el);
  const fb = $('#fb'); if(fb){ fb.style.color='var(--ok)'; fb.textContent = tx(pick(PRAISE)); }
  setTimeout(next, 900);
}
function wrong(el, hint){
  sound('bad'); L.tries++; L.mistakes++;
  if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); }
  const fb = $('#fb'); if(fb){ fb.style.color='var(--gold2)'; fb.textContent = tx(pick(RETRY)); }
  if(hint && L.tries>=1 && !$('#hintbox')){ $('#fb').insertAdjacentHTML('afterend', `<div class="hint" id="hintbox">💡 ${tx(hint)}</div>`); }
}

function renderStep(){
  const s = L.lvl.steps[L.step]; L.tries = 0;
  if(s.t==='read'){
    L.lastRead = s.lines;
    const sc = scene(s.scene || L.lvl.scene, { night:s.night, eraser:s.eraser });
    frame(`<div class="scene">${sc}${s.pic?`<div class="sticker">${s.pic}</div>`:''}</div>
      ${guideHTML()}<div class="story">${s.lines.map((l,i)=>`<p style="animation-delay:${i*0.6}s">${tx(l)}</p>`).join('')}</div>
      <div class="row">${speakBtn()}<div style="flex:1"></div><button class="btn go" id="nx">${tx('הַמְשֵׁךְ')} ◀</button></div>`);
    bindSpeak(s.lines.map(tx).join(' '));
    const nx = $('#nx'); nx.disabled = true; setTimeout(()=>nx.disabled=false, 600*s.lines.length + 300);
    nx.onclick = ()=>{ addCoins(L.replay ? 0 : 2, nx); next(); };
  }
  else if(s.t==='choice' || s.t==='tf'){
    const isTF = s.t==='tf';
    const options = isTF ? ['✔ נָכוֹן','✘ לֹא נָכוֹן'] : s.options;
    const answer  = isTF ? (s.answer ? 0 : 1) : s.answer;
    const qHTML   = isTF ? `<div class="small" style="font-size:22px">${tx('נָכוֹן אוֹ לֹא נָכוֹן?')}</div>${tx(s.q)}` : tx(s.q);
    frame(`<div class="question">${qHTML}</div>
      <div class="options ${isTF?'tf':''}">${options.map((o,i)=>`<button class="opt" data-i="${i}">${tx(o)}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><div class="row">${speakBtn()}${rereadBtn()}</div>`);
    bindSpeak(tx(s.q) + '. ' + (isTF ? 'נכון או לא נכון?' : options.map(tx).join('. '))); bindReread();
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===answer){ b.classList.add('right'); app.querySelectorAll('.opt').forEach(x=>x.disabled=true); correct(b); }
      else { b.classList.add('wrong'); b.disabled=true; wrong(b, s.hint); }
    });
  }
  else if(s.t==='find'){
    const words = s.text.split(/\s+/);
    frame(`<div class="question">${tx(s.q)}</div>
      <div class="words">${words.map((w,i)=>`<span class="w" data-i="${i}">${tx(w)}</span>`).join(' ')}</div>
      <div class="feedback" id="fb"></div><div class="row">${speakBtn()}</div>`);
    bindSpeak(tx(s.q));
    app.querySelectorAll('.w').forEach(el=>el.onclick=()=>{
      if(norm(words[+el.dataset.i])===norm(s.answer)){ el.classList.add('right'); correct(el); }
      else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),600); wrong(el, s.hint); }
    });
  }
  else if(s.t==='order'){
    let pool = s.words.map((w,i)=>i).sort(()=>Math.random()-.5);
    if(pool.every((v,i)=>v===i)) pool.reverse();
    let built = [];
    const draw = ()=>{
      frame(`<div class="question">${tx(s.q)}</div>
        <div class="slot chips" id="built">${built.map((i,k)=>`<button class="chip" data-k="${k}">${tx(s.words[i])}</button>`).join('')}</div>
        <div class="chips" id="pool">${pool.map((i,k)=>`<button class="chip" data-k="${k}">${tx(s.words[i])}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div><div class="row">${speakBtn()}</div>`);
      bindSpeak(s.words.map(tx).join(' '));
      $('#pool').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ built.push(pool.splice(+c.dataset.k,1)[0]); check(); });
      $('#built').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ pool.push(built.splice(+c.dataset.k,1)[0]); draw(); });
    };
    const check = ()=>{
      draw();
      if(pool.length===0){
        if(built.every((v,i)=>v===i)) correct($('#built'));
        else { wrong($('#built'), s.hint); setTimeout(()=>{ pool = built.concat(pool); built=[]; const fb=$('#fb')?.textContent, h=$('#hintbox')?.outerHTML; draw(); $('#fb').textContent=fb||''; if(h) $('#fb').insertAdjacentHTML('afterend',h); }, 900); }
      }
    };
    draw();
  }
  else if(s.t==='number'){
    let val = '';
    frame(`<div class="question">${tx(s.q)}</div>
      <div class="numdisplay" id="nd"></div>
      <div class="numpad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="del">⌫</button><button class="btn go" id="ok">${tx('בְּדִיקָה')} ✔</button>${speakBtn()}</div>
      <div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q));
    const nd = $('#nd'), upd = ()=>nd.textContent = val;
    app.querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{ if(val.length<4){ val+=b.dataset.n; upd(); } });
    $('#del').onclick=()=>{ val=val.slice(0,-1); upd(); };
    $('#ok').onclick=()=>{ if(!val) return; if(+val===s.answer) correct(nd); else { wrong(nd, s.hint); val=''; upd(); } };
    document.onkeydown = e=>{ if(!L || L.lvl.steps[L.step]!==s) return; if(/^\d$/.test(e.key)&&val.length<4){val+=e.key;upd();} if(e.key==='Backspace'){val=val.slice(0,-1);upd();} if(e.key==='Enter') $('#ok').click(); };
  }
  else if(s.t==='name'){
    frame(`${guideHTML(true)}<div class="question">${tx(s.q)}</div>
      <input type="text" id="nm" maxlength="20" value="${esc(S.name)}" autocomplete="off">
      <div class="row"><button class="btn go" id="ok">${tx('זֶה אֲנִי!')} ◀</button>${speakBtn()}</div><div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q));
    $('#nm').focus();
    $('#ok').onclick=()=>{ const v=$('#nm').value.trim(); if(v.length<2){ wrong($('#nm')); return; } S.name=v; save(); refreshBar(); correct($('#ok'), 10); };
  }
  else if(s.t==='write'){
    frame(`${guideHTML(true)}<div class="question">${tx(s.q)}</div>
      <div class="chips" style="min-height:0;margin-bottom:12px">${s.starters.map(w=>`<button class="chip" data-w="${esc(tx(w))}">${tx(w)}</button>`).join('')}</div>
      <textarea id="ta" placeholder="${tx('כְּתֹב כָּאן...')}"></textarea>
      <div class="meter"><i id="mt"></i></div><div class="meter-label" id="ml"></div>
      <div class="row"><button class="btn gold" id="ok" disabled>${tx('שְׁלַח אֶת הַמִּכְתָּב')} ✉️</button>${speakBtn()}${rereadBtn()}</div>
      <div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q)); bindReread();
    const ta=$('#ta'), cnt=()=>ta.value.trim().split(/\s+/).filter(Boolean).length;
    const upd=()=>{ const n=cnt(); $('#mt').style.width=Math.min(100,n/s.minWords*100)+'%';
      $('#ml').textContent = n>=s.minWords ? tx('✔ מְצֻיָּן! אֶפְשָׁר לִשְׁלֹחַ (וְגַם לְהוֹסִיף עוֹד)') : tx(s.minWords-n===1 ? 'עוֹד מִלָּה אַחַת' : `עוֹד ${s.minWords-n} מִלִּים`); $('#ok').disabled = n<s.minWords; };
    app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ ta.value = (ta.value.trim()+' '+c.dataset.w+' ').trimStart(); ta.focus(); upd(); });
    ta.oninput=upd; upd();
    $('#ok').onclick=()=>{
      const text = plain(ta.value), n = cnt();
      const hits = s.keywords.filter(k=>text.includes(k)).length;
      const bonus = 15 + Math.min(15, (n - s.minWords)) + hits*3;
      S.tasks++; S.firstTry++; (S.letters = S.letters||[]).push({ level:L.lvl.id, text:ta.value, at:new Date().toISOString() }); save();
      sound('win'); addCoins(earn(bonus), $('#ok'));
      $('#fb').style.color='var(--ok)';
      $('#fb').textContent = hits>=2 ? tx('😮 מִכְתָּב שֶׁל בַּלָּשׁ אֲמִתִּי! הִסְבַּרְתָּ בְּדִיּוּק מָה גִּלִּיתָ.') : tx('✉️ מִכְתָּב נֶהְדָּר! הוּא נִשְׁלַח.');
      $('#ok').disabled = true; setTimeout(next, 1800);
    };
  }
}

function finishLevel(){
  const id = L.lvl.id, stars = L.mistakes===0 ? 3 : L.mistakes<=2 ? 2 : 1;
  const firstTime = !S.done.includes(id);
  S.stars[id] = Math.max(S.stars[id]||0, stars);
  if(firstTime) S.done.push(id);
  const newCard = L.lvl.card && !S.cards.includes(L.lvl.card);
  if(newCard) S.cards.push(L.lvl.card);
  updateStreak(); save(); refreshBar();
  sound('win'); confetti();
  const c = CARDS[L.lvl.card];
  overlay(`<div class="restored">${scene(L.lvl.scene,{})}</div>
    <h2 class="display" style="font-size:36px;margin:8px 0 0">${tx('הַדַּף נִצַּל!')}</h2>
    <div class="stars-big">${[0,1,2].map(i=>`<span style="animation-delay:${.3+i*.25}s">${i<stars?'⭐':'☆'}</span>`).join('')}</div>
    ${newCard?`<div class="ccard wincard"><div class="e">${c.e}</div><div><b>${tx(c.name)}</b><small>${tx(c.fact)}</small></div></div><div class="small">${tx('קְלָף חָדָשׁ לָאֹסֶף!')}</div>`:''}
    ${L.replay?`<div class="small">${tx('שָׁלָב חוֹזֵר: פָּחוֹת מַטְבְּעוֹת, אֲבָל אֶפְשָׁר לְשַׁפֵּר כּוֹכָבִים')} ⭐</div>`:''}
    <p style="font-size:22px;margin:10px 0 4px">${tx('גַּע בַּתֵּבָה!')}</p>
    <button class="chest" id="chest">${CHEST_CLOSED}</button>`);
  $('#chest').onclick = ()=>{
    const prize = earn(pick([10,15,20,25,30,50]));
    addCoins(prize, $('#chest')); confetti(20);
    $('#chest').outerHTML = `<div style="width:120px;margin:0 auto">${CHEST_OPEN}</div><div style="font-size:40px;font-weight:800;color:var(--gold2)">+${prize} 🪙</div>`;
    $('#overlayBody').insertAdjacentHTML('beforeend', `<p class="story" style="font-size:24px">${tx(L.lvl.end||'')}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="cont">${tx('לַמַּפָּה')} ◀</button></div>`);
    $('#cont').scrollIntoView({behavior:'smooth', block:'end'});
    $('#cont').onclick = ()=>{
      const mins = (Date.now()-sessionStart)/60000;
      if(mins >= S.settings.sessionMin) showBreak(); else showMap(L.world);
    };
  };
}

function showBreak(){
  overlay(`<div style="font-size:80px">🌙</div><h2 class="display" style="font-size:30px">${tx('שׁוֹמֵר זְמַן טוֹב יוֹדֵעַ גַּם לָנוּחַ!')}</h2>
    <p class="story" style="font-size:24px">${tx('עָבַדְתָּ הַיּוֹם מְצֻיָּן. הַסֵּפֶר מְחַכֶּה לְךָ מָחָר – וְהָרֶצֶף שֶׁלְּךָ מַמְשִׁיךְ! 🔥')}</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="bye">${tx('לְהִתְרָאוֹת!')} 👋</button><button class="btn ghost" id="more">${tx('עוֹד שָׁלָב אֶחָד')}</button></div>`);
  $('#bye').onclick = ()=>{ closeOverlay(); showWorlds(); };
  $('#more').onclick = ()=>showMap(L.world);
}

/* ----------------------------- אזור הורים ----------------------------- */
function showParent(){
  overlay(`<h2 class="display">אזור הורים 🔒</h2><p class="small">הקוד ההתחלתי הוא 1234 – כדאי לשנות אותו.</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="6"><div class="row" style="justify-content:center">
    <button class="btn" id="pinok">כניסה</button><button class="btn ghost" id="pincancel">ביטול</button></div>`);
  $('#pin').focus();
  $('#pincancel').onclick = closeOverlay;
  $('#pinok').onclick = ()=>{ if($('#pin').value===S.settings.pin) parentPanel(); else $('#pin').classList.add('shake'); };
}
function parentPanel(){
  const st = S.settings, units = Math.floor(S.coins / st.coinsPer);
  const acc = S.tasks ? Math.round(S.firstTry/S.tasks*100) : 0;
  overlay(`<div style="text-align:right">
    <h2 class="display">אזור הורים</h2>
    <table class="ptable">
      <tr><td>שלבים שהושלמו</td><td><b>${S.done.length}</b></td></tr>
      <tr><td>דקות משחק</td><td><b>${S.minutes}</b></td></tr>
      <tr><td>הצלחה בניסיון ראשון</td><td><b>${acc}%</b> <span class="small">(יעד: 70%–85%)</span></td></tr>
      <tr><td>רצף ימים</td><td><b>${S.streak.count}</b></td></tr>
      <tr><td>מטבעות</td><td><b>${S.coins}</b> = ${units} × ${esc(st.rewardText)}</td></tr>
    </table>
    <div class="row" style="justify-content:center;margin:0 0 16px"><button class="btn gold" id="redeem" ${units?'':'disabled'}>מימוש פרס (−${st.coinsPer} 🪙)</button></div>
    <label class="field">כמה מטבעות שווה פרס אחד<input type="number" id="s1" value="${st.coinsPer}"></label>
    <label class="field">מה הפרס<input type="text" id="s2" value="${esc(st.rewardText)}"></label>
    <label class="field">אחרי כמה דקות להציע הפסקה<input type="number" id="s3" value="${st.sessionMin}"></label>
    <label class="field" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="s5" ${S.nikud?'checked':''} style="width:26px;height:26px"> להציג ניקוד בכל המשחק (מומלץ להשאיר)</label>
    <label class="field">קוד הורים חדש<input type="text" id="s4" value="${esc(st.pin)}"></label>
    ${(S.letters||[]).length?`<h3>מכתבים שהוא כתב</h3>${S.letters.slice(-5).reverse().map(l=>`<div class="hint" style="font-size:18px">${esc(l.text)}</div>`).join('')}`:''}
    <div class="small" style="margin-top:12px">מימושים: ${S.redeemed.length ? S.redeemed.slice(-5).map(r=>new Date(r).toLocaleDateString('he-IL')).join(', ') : 'עדיין אין'}</div>
    <div class="row" style="justify-content:space-between"><button class="btn go" id="psave">שמירה</button>
    <button class="btn ghost" id="preset" style="color:#c0392b">איפוס התקדמות</button></div></div>`);
  $('#redeem').onclick = ()=>{ S.coins -= st.coinsPer; S.redeemed.push(Date.now()); save(); refreshBar(); confetti(); parentPanel(); };
  $('#psave').onclick = ()=>{ st.coinsPer=Math.max(1,+$('#s1').value||100); st.rewardText=$('#s2').value; st.sessionMin=Math.max(3,+$('#s3').value||12); st.pin=$('#s4').value||'1234'; S.nikud=$('#s5').checked; save(); closeOverlay(); refreshBar();
    if(screen==='level') renderStep(); else if(screen==='map') showMap(mapWorld); else if(screen==='cards') showCards(); else showWorlds(); };
  $('#preset').onclick = ()=>{ if(confirm('למחוק את כל ההתקדמות?')){ const keep=S.settings; S=structuredClone(DEFAULT); S.settings=keep; save(); closeOverlay(); showWorlds(); } };
}

/* ----------------------------- חיבורים ----------------------------- */
$('#homeBtn').onclick = showWorlds;
$('#cardsBtn').onclick = showCards;
$('#parentBtn').onclick = showParent;
$('#overlay').onclick = e=>{ if(e.target.id==='overlay' && !$('#chest') && !$('#cont')) closeOverlay(); };
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(screen==='map') showMap(mapWorld); }, 250); });

// פתיחה: ילד חדש מתחיל ישר בפרולוג
if(!S.done.includes('p1')) { refreshBar(); playLevel('history', 0); } else showWorlds();
</script>
</body>
</html>
