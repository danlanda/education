<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>שומרי הזמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1b1036; --bg2:#3a1f6b; --card:#fffaf0; --ink:#2b2140; --muted:#7a6f8f;
  --gold:#f6b93b; --gold2:#e58e26; --ok:#2ecc71; --bad:#ff7675; --accent:#6c5ce7; --sky:#74b9ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Noto Sans Hebrew',Arial,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 30% 10%,var(--bg2),var(--bg1) 70%);background-color:var(--bg1);
  min-height:100vh;overflow-x:hidden;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

/* top bar */
#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:rgba(0,0,0,.25);backdrop-filter:blur(6px);color:#fff}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;display:flex;gap:6px;align-items:center}
#topbar .spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;font-size:22px;width:46px;height:46px}
#rank{font-size:16px;font-weight:600;opacity:.9}

main{max-width:900px;margin:0 auto;padding:16px}

/* generic card */
.panel{background:var(--card);border-radius:28px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
h1,h2{margin:0 0 12px}
.big-title{color:#fff;text-align:center;font-size:44px;margin:24px 0 4px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.subtitle{color:#e6dcff;text-align:center;font-size:20px;margin-bottom:24px}

/* worlds */
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.world{border-radius:28px;padding:26px 20px;color:#fff;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s;font-size:18px;position:relative}
.world:active{transform:scale(.97)}
.world .emoji{font-size:72px}
.world b{font-size:26px}
.w-hist{background:linear-gradient(160deg,#e58e26,#b33939)}
.w-adv{background:linear-gradient(160deg,#00b894,#006266)}
.w-saba{background:linear-gradient(160deg,#0984e3,#2d3436)}
.locked{filter:grayscale(.55);opacity:.8}
.lock-tag{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;font-size:15px}

/* map */
.map{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 40px}
.node{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:46px;background:#fff;box-shadow:0 8px 0 #c9b8ff,0 12px 30px rgba(0,0,0,.4);position:relative;transition:transform .15s}
.node:active{transform:translateY(4px)}
.node.done{background:linear-gradient(#fff6d6,#ffd96a);box-shadow:0 8px 0 var(--gold2),0 12px 30px rgba(0,0,0,.4)}
.node.current{animation:pulse 1.4s infinite}
.node.lockednode{background:#5b4b80;box-shadow:0 8px 0 #3b2e5a;font-size:36px;color:#fff}
.node-label{color:#fff;font-weight:800;font-size:20px;text-align:center;margin-bottom:6px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.node-stars{position:absolute;bottom:-34px;font-size:20px;letter-spacing:2px}
.path{width:10px;height:44px;border-radius:5px;background:repeating-linear-gradient(#fff6 0 10px,transparent 10px 20px)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* level */
.progress{display:flex;gap:6px;margin:4px 0 14px}
.progress span{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.18)}
.progress span.on{background:var(--gold)}
.guide{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;background:linear-gradient(#ffeaa7,#fab1a0);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 4px 0 #e17055}
.guide-name{font-weight:800;color:var(--accent);font-size:18px}
.story{font-size:32px;line-height:1.9;font-weight:600}
.story p{margin:0 0 6px;opacity:0;transform:translateY(8px);animation:in .45s forwards}
@keyframes in{to{opacity:1;transform:none}}
.question{font-size:28px;line-height:1.8;font-weight:800;margin-bottom:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.btn{border-radius:20px;padding:16px 28px;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(var(--accent),#4834d4);box-shadow:0 6px 0 #30229c;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #30229c}
.btn.go{background:linear-gradient(#55efc4,#00b894);box-shadow:0 6px 0 #00876a}
.btn.gold{background:linear-gradient(var(--gold),var(--gold2));box-shadow:0 6px 0 #b86b10}
.btn.ghost{background:#efe8ff;color:var(--accent);box-shadow:0 6px 0 #cfc2ff;font-size:20px;padding:12px 18px}
.btn:disabled{opacity:.45}
.options{display:grid;gap:14px}
.opt{text-align:right;background:#fff;border:3px solid #e3dbff;border-radius:20px;padding:18px 22px;font-size:28px;font-weight:600;color:var(--ink);box-shadow:0 5px 0 #e3dbff}
.opt:active{transform:translateY(3px)}
.opt.right{border-color:var(--ok);background:#e8fff1;box-shadow:0 5px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fff0f0;box-shadow:0 5px 0 var(--bad);opacity:.6}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
.words{font-size:34px;line-height:2.2;font-weight:600}
.w{display:inline-block;padding:0 8px;border-radius:12px;margin:2px;cursor:pointer;border-bottom:3px dashed #d6ccff}
.w.right{background:#c8f7dc;border-color:var(--ok)}
.w.wrong{background:#ffd9d9}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:70px}
.chip{background:#fff;border:3px solid #e3dbff;border-radius:16px;padding:10px 18px;font-size:28px;font-weight:600;box-shadow:0 4px 0 #e3dbff;color:var(--ink)}
.slot{border:3px dashed #c9b8ff;border-radius:18px;padding:10px;background:#f7f3ff;margin-bottom:14px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:520px}
.numpad button{font-size:30px;font-weight:800;border-radius:16px;padding:14px 0;background:#fff;border:3px solid #e3dbff;box-shadow:0 4px 0 #e3dbff;color:var(--ink)}
.numdisplay{font-size:48px;font-weight:800;min-width:140px;text-align:center;background:#f7f3ff;border:3px dashed #c9b8ff;border-radius:18px;padding:6px 20px;display:inline-block;margin-bottom:14px;min-height:80px}
textarea,input[type=text],input[type=number],input[type=password]{width:100%;font-family:inherit;font-size:28px;border:3px solid #d6ccff;border-radius:18px;padding:14px;color:var(--ink);background:#fff;user-select:text}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.meter{height:16px;border-radius:8px;background:#eee;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));width:0;transition:width .3s}
.meter-label{font-size:18px;color:var(--muted)}
.hint{margin-top:16px;background:#fff7e0;border-radius:16px;padding:12px 16px;font-size:24px;border-right:6px solid var(--gold)}
.feedback{font-size:26px;font-weight:800;margin-top:12px;min-height:36px}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(10,5,30,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay .panel{max-width:620px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.celebrate-emoji{font-size:90px;animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.stars-big{font-size:56px;letter-spacing:8px}
.coinfly{position:fixed;font-size:34px;pointer-events:none;z-index:60;animation:fly 1s forwards;font-weight:800;color:var(--gold)}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) scale(1.4)}}
.confetti{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:55;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.chest{font-size:110px;cursor:pointer;display:inline-block;animation:wobble 1s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.ccard{background:linear-gradient(160deg,#fff,#fff3c4);border-radius:22px;padding:18px;text-align:center;box-shadow:0 6px 0 var(--gold2);min-height:220px}
.ccard .e{font-size:64px}
.ccard b{display:block;font-size:22px;margin:6px 0}
.ccard small{font-size:16px;color:var(--muted);line-height:1.5;display:block}
.ccard.off{background:#5b4b80;box-shadow:0 6px 0 #3b2e5a;color:#cfc2ff}
.ccard.off .e{filter:brightness(0) invert(.4)}

/* parent */
.ptable{width:100%;border-collapse:collapse;font-size:20px;margin:10px 0 20px}
.ptable td{padding:8px;border-bottom:1px solid #eee}
.small{font-size:18px;color:var(--muted)}
label.field{display:block;font-size:20px;margin:12px 0}
label.field input{font-size:22px;padding:8px 12px;margin-top:4px}

@media (max-width:600px){
  .story{font-size:26px}.question{font-size:24px}.opt{font-size:23px}.btn{font-size:22px}.words{font-size:28px}
  .panel{padding:20px}.big-title{font-size:34px}
}
</style>
</head>
<body>

<div id="topbar">
  <button class="iconbtn" id="homeBtn" title="בית">🏠</button>
  <div class="pill" title="מטבעות">🪙 <span id="coins">0</span></div>
  <div class="pill" title="ימים ברצף">🔥 <span id="streak">0</span></div>
  <div id="rank"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="nikudBtn" title="ניקוד">אָ</button>
  <button class="iconbtn" id="cardsBtn" title="האוסף שלי">🃏</button>
  <button class="iconbtn" id="parentBtn" title="אזור הורים">⚙️</button>
</div>

<main id="app"></main>
<div id="overlay" class="hidden"><div class="panel" id="overlayBody"></div></div>

<script>
/* =====================================================================
   תוכן המשחק
   כאן נמצאים כל הסיפורים והמשימות. כדי להוסיף שלב – מעתיקים שלב קיים
   ומשנים את הטקסטים. {name} מוחלף בשם של הילד.
   ===================================================================== */
const GUIDE = { name: 'יוּבַל', emoji: '🧑‍🏫' };

const CARDS = {
  book:       { e:'📖', name:'סֵפֶר הַזְּמַן', fact:'כל הסיפורים של העולם גרים בתוכו. המוחק רוצה למחוק אותם.' },
  crown:      { e:'👑', name:'כֶּתֶר הַזָּהָב', fact:'מלך סירקוזה חשד שהצורף רימה אותו.' },
  archimedes: { e:'🛁', name:'אַרְכִימֶדֶס', fact:'מדען וממציא מסירקוזה. גילה איך מים עוזרים למדוד חפצים, והמציא מכונות ענק להגן על העיר.' },
  marco:      { e:'🐫', name:'מַרְקוֹ פּוֹלוֹ', fact:'יצא מוונציה ונסע 24 שנים עד סין ובחזרה.' },
  leonardo:   { e:'🎨', name:'לֵאוֹנַרְדוֹ דָּה וִינְצִ\'י', fact:'צייר את המונה ליזה ושרטט מכונות מעופפות 400 שנה לפני המטוס.' },
  harriet:    { e:'⭐', name:'הַרְיֶט טַבְּמַן', fact:'ברחה מעבדות והובילה עשרות אנשים לחופש בדרך סודית.' },
};

const WORLDS = [
  { id:'history', title:'דְּמֻיּוֹת בַּהִיסְטוֹרְיָה', emoji:'🏛️', cls:'w-hist', open:true,
    desc:'ממציאים, מגלי ארצות ומהפכנים' },
  { id:'adventure', title:'הַרְפַּתְקָאוֹת', emoji:'🗺️', cls:'w-adv', open:false,
    desc:'איים, אוצרות ומסעות', lockText:'נפתח בקרוב' },
  { id:'saba', title:'הַסִּפּוּרִים שֶׁל סַבָּא יַעֲקֹב', emoji:'🇮🇱', cls:'w-saba', open:false,
    desc:'איך הקמנו את מדינת ישראל', lockText:'אבא כותב את הדפים האלה' },
];

const LEVELS = {
  history: [
  { id:'p1', title:'הַסֵּפֶר שֶׁנִּמְחַק', emoji:'📖', card:'book',
    end:'וְאוּלַי נְגַלֶּה מִי הַמּוֹחֵק בֶּאֱמֶת...',
    steps:[
      { t:'read', lines:['שָׁלוֹם! אֲנִי יוּבַל.','אֲנִי אוֹהֵב סִפּוּרִים עַל הִיסְטוֹרְיָה.','וְזֶה הַסֵּפֶר הֲכִי חָשׁוּב שֶׁלִּי: סֵפֶר הַזְּמַן. 📖'] },
      { t:'read', lines:['בְּתוֹךְ הַסֵּפֶר גָּרִים כָּל הַגִּבּוֹרִים שֶׁל הָעוֹלָם.','מַמְצִיאִים, מְלָכִים וּמְגַלֵּי אֲרָצוֹת.','אֲבָל אֶתְמוֹל בַּלַּיְלָה קָרָה מַשֶּׁהוּ נוֹרָא...'] },
      { t:'read', lines:['מִישֶׁהוּ נִכְנַס לַסִּפְרִיָּה שֶׁלִּי.','הוּא לָבַשׁ גְּלִימָה שְׁחוֹרָה. 🦹','וְהוּא מָחַק דַּפִּים מֵהַסֵּפֶר!'] },
      { t:'choice', q:'מָה עָשָׂה הָאִישׁ בַּגְּלִימָה הַשְּׁחוֹרָה?',
        options:['מָחַק דַּפִּים מֵהַסֵּפֶר','אָפָה עוּגָה','שָׁתָה מַיִם'], answer:0,
        hint:'תִּקְרָא שׁוּב אֶת הַשּׁוּרָה הָאַחֲרוֹנָה בַּסִּפּוּר.' },
      { t:'read', lines:['קוֹרְאִים לוֹ: הַמּוֹחֵק.','כְּשֶׁדַּף נִמְחָק – כֻּלָּם שׁוֹכְחִים אֶת הַגִּבּוֹר שֶׁלּוֹ.','אֲנִי צָרִיךְ עֶזְרָה. אֲנִי צָרִיךְ שׁוֹמֵר זְמַן חָדָשׁ!'] },
      { t:'find', q:'גַּע בַּמִּלָּה שֶׁהִיא הַשֵּׁם שֶׁל הָאִישׁ הָרַע:',
        text:'קוֹרְאִים לוֹ הַמּוֹחֵק, וְהוּא בּוֹרֵחַ בַּלַּיְלָה.', answer:'הַמּוֹחֵק',
        hint:'הַשֵּׁם מַתְחִיל בָּאוֹת ה.' },
      { t:'name', q:'שׁוֹמֵר זְמַן חָדָשׁ, אֵיךְ קוֹרְאִים לְךָ? כְּתֹב אֶת הַשֵּׁם שֶׁלְּךָ:' },
      { t:'read', lines:['{name}, בָּרוּךְ הַבָּא לְשׁוֹמְרֵי הַזְּמַן! 🎉','בְּיַחַד נַחְזִיר אֶת הַדַּפִּים הַמְּחוּקִים לַסֵּפֶר.'] },
    ]},

  { id:'a1', title:'הַכֶּתֶר שֶׁל הַמֶּלֶךְ', emoji:'👑', card:'crown',
    end:'מָה יִקְרֶה בָּאַמְבַּטְיָה? נְגַלֶּה בַּשָּׁלָב הַבָּא!',
    steps:[
      { t:'read', lines:['הַדַּף הָרִאשׁוֹן שֶׁנִּמְחַק הוּא שֶׁל אַרְכִימֶדֶס.','קְפֹץ אִתִּי לְתוֹךְ הַסֵּפֶר! 🌀'] },
      { t:'read', lines:['אֲנַחְנוּ בָּעִיר סִירָקוּזָה, לִפְנֵי יוֹתֵר מֵאַלְפַּיִם שָׁנָה.','פֹּה גָּר אַרְכִימֶדֶס.','הוּא מַמְצִיא גָּאוֹן, וְהוּא אוֹהֵב חֶשְׁבּוֹן.'] },
      { t:'choice', q:'מִי זֶה אַרְכִימֶדֶס?', options:['מַמְצִיא גָּאוֹן','שׁוֹדֵד יָם','מֶלֶךְ'], answer:0,
        hint:'חַפֵּשׂ בַּסִּפּוּר אֶת הַמִּלָּה "מַמְצִיא".' },
      { t:'read', lines:['הַמֶּלֶךְ שֶׁל סִירָקוּזָה הִזְמִין כֶּתֶר מִזָּהָב. 👑','אֲבָל הַמֶּלֶךְ חָשַׁד:','אוּלַי הַצּוֹרֵף רִמָּה, וְשָׂם בַּכֶּתֶר גַּם כֶּסֶף זוֹל?'] },
      { t:'choice', q:'מִמָּה הָיָה צָרִיךְ לִהְיוֹת הַכֶּתֶר?', options:['מֵעֵץ','מִזָּהָב','מִנְּיָר'], answer:1,
        hint:'מָה הַמֶּלֶךְ הִזְמִין? כֶּתֶר מִ...' },

function load(){ try{ S = Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem('keepers')||'{}')); }catch(e){ S = structuredClone(DEFAULT); } }

   ===================================================================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const NIKUD = /[֑-ׇֽֿׁׂׅׄ]/g;
const plain = s => s.replace(NIKUD,'');
const tx = s => { s = s.replace(/\{name\}/g, S.name || 'שׁוֹמֵר'); return S.nikud ? s : plain(s); };
const norm = s => plain(s).replace(/[^א-ת0-9]/g,'');
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rank(){ let r = RANKS[0]; RANKS.forEach(x=>{ if(S.done.length >= x.min) r = x; }); return r.name; }
function refreshBar(){
  $('#coins').textContent = S.coins; $('#streak').textContent = S.streak.count;
  $('#rank').textContent = tx(rank()) + (S.name ? ' · ' + S.name : '');
  $('#nikudBtn').textContent = S.nikud ? 'אָ' : 'א';
}
function addCoins(n, el){
  S.coins += n; save(); refreshBar();
  const r = (el||$('#coins')).getBoundingClientRect();
  const f = document.createElement('div'); f.className='coinfly'; f.textContent = '+' + n + ' 🪙';
  f.style.left = (r.left + r.width/2 - 30) + 'px'; f.style.top = (r.top) + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
}
function confetti(n=40){
  const em = ['⭐','✨','🎉','🪙','💛','🎊'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti'; c.textContent=pick(em);
    c.style.left=Math.random()*100+'vw'; c.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3200); }
}
function sound(type){
  try{
    const ctx = sound.ctx || (sound.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const notes = type==='ok' ? [660,880] : type==='win' ? [523,659,784,1046] : [300];
    notes.forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=f; o.type='triangle';
      g.gain.setValueAtTime(.15, ctx.currentTime+i*.12); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+i*.12+.25);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*.12); o.stop(ctx.currentTime+i*.12+.3); });
  }catch(e){}
}
let heVoice = null;
function initVoice(){ try{ heVoice = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('he')) || null; }catch(e){} }
try{ initVoice(); speechSynthesis.onvoiceschanged = initVoice; }catch(e){}
function speak(text){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang='he-IL'; u.rate=.85; if(heVoice) u.voice=heVoice; speechSynthesis.speak(u); }catch(e){}
}
function overlay(html){ $('#overlayBody').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function closeOverlay(){ $('#overlay').classList.add('hidden'); }
function updateStreak(){
  const today = new Date().toDateString();
  if(S.streak.last === today) return;
  const diff = S.streak.last ? Math.round((new Date(today) - new Date(S.streak.last))/86400000) : 99;
  S.streak.count = diff <= 2 ? S.streak.count + 1 : 1;   // סלחני: יום אחד שפוספס לא מאפס
  S.streak.last = today; save();
}

/* ----------------------------- שלב ----------------------------- */
let L; // current level runtime
function playLevel(world, idx){
  const lvl = LEVELS[world][idx];
  L = { world, idx, lvl, step:0, mistakes:0, lastRead:null };
  renderStep();
}
function guideHTML(){ return `<div class="guide"><div class="avatar">${GUIDE.emoji}</div><div><div class="guide-name">${tx(GUIDE.name)}</div></div></div>`; }
function progressHTML(){ return `<div class="progress">${L.lvl.steps.map((_,i)=>`<span class="${i<L.step?'on':''}"></span>`).join('')}</div>`; }
function frame(inner){
  app.innerHTML = progressHTML() + `<div class="panel">${inner}</div>`;
}
function next(){ L.step++; if(L.step >= L.lvl.steps.length) finishLevel(); else renderStep(); }
function rereadBtn(){ return L.lastRead ? `<button class="btn ghost" id="reread">📖 ${tx('לִקְרֹא שׁוּב')}</button>` : ''; }
function bindReread(){ const b=$('#reread'); if(b) b.onclick=()=>{ overlay(`<div class="story" style="text-align:right">${L.lastRead.map(l=>`<p>${tx(l)}</p>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="ovSpeak">🔊</button><button class="btn go" id="ovClose">${tx('הֵבַנְתִּי')}</button></div>`);
  $('#ovClose').onclick=closeOverlay; $('#ovSpeak').onclick=()=>speak(L.lastRead.map(tx).join(' ')); }; }
function speakBtn(text){ return `<button class="btn ghost" id="spk" title="הקרא לי">🔊 ${tx('הַקְרֵא לִי')}</button>`; }
function bindSpeak(text){ const b=$('#spk'); if(b) b.onclick=()=>speak(text); }

function correct(el, base=10){
  sound('ok'); S.tasks++; const first = L.tries===0; if(first) S.firstTry++;
  addCoins(first ? base : Math.ceil(base/2), el);
  const fb = $('#fb'); if(fb){ fb.style.color='var(--ok)'; fb.textContent = tx(pick(PRAISE)); }
  setTimeout(next, 900);
}
function wrong(el, hint){
  sound('bad'); L.tries++; L.mistakes++;
  if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); }
  const fb = $('#fb'); if(fb){ fb.style.color='var(--gold2)'; fb.textContent = tx(pick(RETRY)); }
  if(hint && L.tries>=1 && !$('#hintbox')){ $('#fb').insertAdjacentHTML('afterend', `<div class="hint" id="hintbox">💡 ${tx(hint)}</div>`); }
}

function renderStep(){
  const s = L.lvl.steps[L.step]; L.tries = 0;
  if(s.t==='read'){
    L.lastRead = s.lines;
    frame(`${guideHTML()}<div class="story">${s.lines.map((l,i)=>`<p style="animation-delay:${i*0.6}s">${tx(l)}</p>`).join('')}</div>
      <div class="row">${speakBtn()}<div style="flex:1"></div><button class="btn go" id="nx">${tx('הַמְשֵׁךְ')} ◀</button></div>`);
    bindSpeak(s.lines.map(tx).join(' '));
    const nx = $('#nx'); nx.disabled = true; setTimeout(()=>nx.disabled=false, 600*s.lines.length + 300);
    nx.onclick = ()=>{ addCoins(2, nx); next(); };
  }
  else if(s.t==='choice'){
    const order = s.options.map((o,i)=>i);
    frame(`<div class="question">${tx(s.q)}</div>
      <div class="options">${order.map(i=>`<button class="opt" data-i="${i}">${tx(s.options[i])}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><div class="row">${speakBtn()}${rereadBtn()}</div>`);
    bindSpeak(tx(s.q) + '. ' + s.options.map(tx).join('. ')); bindReread();
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===s.answer){ b.classList.add('right'); app.querySelectorAll('.opt').forEach(x=>x.disabled=true); correct(b); }
      else { b.classList.add('wrong'); b.disabled=true; wrong(b, s.hint); }
    });
  }
  else if(s.t==='find'){
    const words = s.text.split(/\s+/);
    frame(`<div class="question">${tx(s.q)}</div>
      <div class="words">${words.map((w,i)=>`<span class="w" data-i="${i}">${tx(w)}</span>`).join(' ')}</div>
      <div class="feedback" id="fb"></div><div class="row">${speakBtn()}</div>`);
    bindSpeak(tx(s.q));
    app.querySelectorAll('.w').forEach(el=>el.onclick=()=>{
      if(norm(words[+el.dataset.i])===norm(s.answer)){ el.classList.add('right'); correct(el); }
      else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),600); wrong(el, s.hint); }
    });
  }
  else if(s.t==='order'){
    let pool = s.words.map((w,i)=>i).sort(()=>Math.random()-.5);
    if(pool.every((v,i)=>v===i)) pool.reverse();
    let built = [];
    const draw = ()=>{
      frame(`<div class="question">${tx(s.q)}</div>
        <div class="slot chips" id="built">${built.map((i,k)=>`<button class="chip" data-k="${k}">${tx(s.words[i])}</button>`).join('')}</div>
        <div class="chips" id="pool">${pool.map((i,k)=>`<button class="chip" data-k="${k}">${tx(s.words[i])}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div><div class="row">${speakBtn()}</div>`);
      bindSpeak(s.words.map(tx).join(' '));
      $('#pool').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ built.push(pool.splice(+c.dataset.k,1)[0]); check(); });
      $('#built').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ pool.push(built.splice(+c.dataset.k,1)[0]); draw(); });
    };
    const check = ()=>{
      draw();
      if(pool.length===0){
        if(built.every((v,i)=>v===i)) correct($('#built'));
        else { wrong($('#built'), s.hint); setTimeout(()=>{ pool = built.concat(pool); built=[]; const fb=$('#fb')?.textContent, h=$('#hintbox')?.outerHTML; draw(); $('#fb').textContent=fb||''; if(h) $('#fb').insertAdjacentHTML('afterend',h); }, 900); }
      }
    };
    draw();
  }
  else if(s.t==='number'){
    let val = '';
    frame(`<div class="question">${tx(s.q)}</div>
      <div class="numdisplay" id="nd"></div>
      <div class="numpad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" id="del">⌫</button><button class="btn go" id="ok">${tx('בְּדִיקָה')} ✔</button>${speakBtn()}</div>
      <div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q));
    const nd = $('#nd'), upd = ()=>nd.textContent = val;
    app.querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{ if(val.length<4){ val+=b.dataset.n; upd(); } });
    $('#del').onclick=()=>{ val=val.slice(0,-1); upd(); };
    $('#ok').onclick=()=>{ if(!val) return; if(+val===s.answer) correct(nd); else { wrong(nd, s.hint); val=''; upd(); } };
    document.onkeydown = e=>{ if(!L || L.lvl.steps[L.step]!==s) return; if(/^\d$/.test(e.key)&&val.length<4){val+=e.key;upd();} if(e.key==='Backspace'){val=val.slice(0,-1);upd();} if(e.key==='Enter') $('#ok').click(); };
  }
  else if(s.t==='name'){
    frame(`${guideHTML()}<div class="question">${tx(s.q)}</div>
      <input type="text" id="nm" maxlength="20" value="${esc(S.name)}" autocomplete="off">
      <div class="row"><button class="btn go" id="ok">${tx('זֶה אֲנִי!')} ◀</button>${speakBtn()}</div><div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q));
    $('#nm').focus();
    $('#ok').onclick=()=>{ const v=$('#nm').value.trim(); if(v.length<2){ wrong($('#nm')); return; } S.name=v; save(); refreshBar(); correct($('#ok'), 10); };
  }
  else if(s.t==='write'){
    frame(`${guideHTML()}<div class="question">${tx(s.q)}</div>
      <div class="chips" style="min-height:0;margin-bottom:12px">${s.starters.map(w=>`<button class="chip" data-w="${esc(plain(w))}">${tx(w)}</button>`).join('')}</div>
      <textarea id="ta" placeholder="${plain('כְּתֹב כָּאן...')}"></textarea>
      <div class="meter"><i id="mt"></i></div><div class="meter-label" id="ml"></div>
      <div class="row"><button class="btn gold" id="ok" disabled>${tx('שְׁלַח אֶת הַמִּכְתָּב')} ✉️</button>${speakBtn()}${rereadBtn()}</div>
      <div class="feedback" id="fb"></div>`);
    bindSpeak(tx(s.q)); bindReread();
    const ta=$('#ta'), cnt=()=>ta.value.trim().split(/\s+/).filter(Boolean).length;
    const upd=()=>{ const n=cnt(); $('#mt').style.width=Math.min(100,n/s.minWords*100)+'%';
      $('#ml').textContent = n>=s.minWords ? '✔ מצוין! אפשר לשלוח (וגם להוסיף עוד)' : `עוד ${s.minWords-n} מילים`; $('#ok').disabled = n<s.minWords; };
    app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ ta.value = (ta.value.trim()+' '+c.dataset.w+' ').trimStart(); ta.focus(); upd(); });
    ta.oninput=upd; upd();
    $('#ok').onclick=()=>{
      const text = plain(ta.value), n = cnt();
      const hits = s.keywords.filter(k=>text.includes(k)).length;
      const bonus = 15 + Math.min(15, (n - s.minWords)) + hits*3;
      S.tasks++; S.firstTry++; (S.letters = S.letters||[]).push({ level:L.lvl.id, text:ta.value, at:new Date().toISOString() }); save();
      sound('win'); addCoins(bonus, $('#ok'));
      $('#fb').style.color='var(--ok)';
      $('#fb').textContent = hits>=2 ? '😮 מכתב של בלש אמיתי! הסברת בדיוק מה גילית.' : '✉️ מכתב נהדר! המלך קיבל אותו.';
      $('#ok').disabled = true; setTimeout(next, 1800);
    };
  }
}

function finishLevel(){
  const id = L.lvl.id, stars = L.mistakes===0 ? 3 : L.mistakes<=2 ? 2 : 1;
  const firstTime = !S.done.includes(id);
  S.stars[id] = Math.max(S.stars[id]||0, stars);
  if(firstTime) S.done.push(id);
  const newCard = L.lvl.card && !S.cards.includes(L.lvl.card);
  if(newCard) S.cards.push(L.lvl.card);
  updateStreak(); save(); refreshBar();
  sound('win'); confetti();
  const c = CARDS[L.lvl.card];
  overlay(`<div class="celebrate-emoji">🏆</div>
    <h2 style="font-size:34px">${tx('הַדַּף נִצַּל!')}</h2>
    <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    ${newCard?`<div class="ccard" style="max-width:240px;margin:14px auto"><div class="e">${c.e}</div><b>${tx(c.name)}</b><small>${c.fact}</small></div><div class="small">קלף חדש לאוסף!</div>`:''}
    <p style="font-size:22px">${tx('גַּע בַּתֵּבָה!')}</p>
    <div class="chest" id="chest">🎁</div>`);
  $('#chest').onclick = ()=>{
    const prize = pick([10,15,20,25,30,50]);
    addCoins(prize, $('#chest')); confetti(20);
    $('#chest').outerHTML = `<div style="font-size:40px;font-weight:800;color:var(--gold2)">+${prize} 🪙</div>`;
    $('#overlayBody').insertAdjacentHTML('beforeend', `<p class="story" style="font-size:26px">${tx(L.lvl.end||'')}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="cont">${tx('לַמַּפָּה')} ◀</button></div>`);
    $('#cont').onclick = ()=>{
      const mins = (Date.now()-sessionStart)/60000;
      if(mins >= S.settings.sessionMin) showBreak(); else showMap(L.world);
    };
  };
}

function showBreak(){
  overlay(`<div class="celebrate-emoji">🧘</div><h2 style="font-size:30px">${tx('שׁוֹמֵר זְמַן טוֹב יוֹדֵעַ גַּם לָנוּחַ!')}</h2>
    <p class="story" style="font-size:24px">${tx('עָבַדְתָּ הַיּוֹם מְצֻיָּן. הַסֵּפֶר מְחַכֶּה לְךָ מָחָר – וְהָרֶצֶף שֶׁלְּךָ מַמְשִׁיךְ! 🔥')}</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="bye">${tx('לְהִתְרָאוֹת!')} 👋</button><button class="btn ghost" id="more">${tx('עוֹד שָׁלָב אֶחָד')}</button></div>`);
  $('#bye').onclick = ()=>{ closeOverlay(); showWorlds(); };
  $('#more').onclick = ()=>showMap(L.world);
}

/* ----------------------------- אזור הורים ----------------------------- */
function showParent(){
  overlay(`<h2>אזור הורים 🔒</h2><p class="small">הקוד ההתחלתי הוא 1234 – כדאי לשנות אותו.</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="6"><div class="row" style="justify-content:center">
    <button class="btn" id="pinok">כניסה</button><button class="btn ghost" id="pincancel">ביטול</button></div>`);
  $('#pin').focus();
  $('#pincancel').onclick = closeOverlay;
  $('#pinok').onclick = ()=>{ if($('#pin').value===S.settings.pin) parentPanel(); else $('#pin').classList.add('shake'); };
}
function parentPanel(){
  const st = S.settings, units = Math.floor(S.coins / st.coinsPer);
  const acc = S.tasks ? Math.round(S.firstTry/S.tasks*100) : 0;
  overlay(`<div style="text-align:right">
    <h2>אזור הורים</h2>
    <table class="ptable">
      <tr><td>שלבים שהושלמו</td><td><b>${S.done.length}</b></td></tr>
      <tr><td>דקות משחק</td><td><b>${S.minutes}</b></td></tr>
      <tr><td>הצלחה בניסיון ראשון</td><td><b>${acc}%</b> <span class="small">(יעד: 70%–85%)</span></td></tr>
      <tr><td>רצף ימים</td><td><b>${S.streak.count}</b></td></tr>
      <tr><td>מטבעות</td><td><b>${S.coins}</b> = ${units} × ${esc(st.rewardText)}</td></tr>
    </table>
    <div class="row" style="justify-content:center;margin:0 0 16px"><button class="btn gold" id="redeem" ${units?'':'disabled'}>מימוש פרס (−${st.coinsPer} 🪙)</button></div>
    <label class="field">כמה מטבעות שווה פרס אחד<input type="number" id="s1" value="${st.coinsPer}"></label>
    <label class="field">מה הפרס<input type="text" id="s2" value="${esc(st.rewardText)}"></label>
    <label class="field">אחרי כמה דקות להציע הפסקה<input type="number" id="s3" value="${st.sessionMin}"></label>
    <label class="field">קוד הורים חדש<input type="text" id="s4" value="${esc(st.pin)}"></label>
    ${(S.letters||[]).length?`<h3>מכתבים שהוא כתב</h3>${S.letters.slice(-5).reverse().map(l=>`<div class="hint" style="font-size:18px">${esc(l.text)}</div>`).join('')}`:''}
    <div class="small" style="margin-top:12px">מימושים: ${S.redeemed.length ? S.redeemed.slice(-5).map(r=>new Date(r).toLocaleDateString('he-IL')).join(', ') : 'עדיין אין'}</div>
    <div class="row" style="justify-content:space-between"><button class="btn go" id="psave">שמירה</button>
    <button class="btn ghost" id="preset" style="color:#c0392b">איפוס התקדמות</button></div></div>`);
  $('#redeem').onclick = ()=>{ S.coins -= st.coinsPer; S.redeemed.push(Date.now()); save(); refreshBar(); confetti(); parentPanel(); };
  $('#psave').onclick = ()=>{ st.coinsPer=Math.max(1,+$('#s1').value||100); st.rewardText=$('#s2').value; st.sessionMin=Math.max(3,+$('#s3').value||12); st.pin=$('#s4').value||'1234'; save(); closeOverlay(); };
  $('#preset').onclick = ()=>{ if(confirm('למחוק את כל ההתקדמות?')){ const keep=S.settings; S=structuredClone(DEFAULT); S.settings=keep; save(); closeOverlay(); showWorlds(); } };
}

/* ----------------------------- חיבורים ----------------------------- */
$('#homeBtn').onclick = showWorlds;
$('#cardsBtn').onclick = showCards;
$('#parentBtn').onclick = showParent;
$('#nikudBtn').onclick = ()=>{ S.nikud=!S.nikud; save(); refreshBar(); if(L && app.querySelector('.progress')) renderStep(); else showWorlds(); };
$('#overlay').onclick = e=>{ if(e.target.id==='overlay' && !$('#chest') && !$('#cont')) closeOverlay(); };

// פתיחה: ילד חדש מתחיל ישר בפרולוג
if(!S.done.includes('p1')) { refreshBar(); playLevel('history', 0); } else showWorlds();
</script>
</body>
</html>
